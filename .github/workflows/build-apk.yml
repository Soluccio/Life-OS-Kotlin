name: Gerar APK Life OS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: LifeOS-Kotlin
        run: gradle --no-daemon assembleDebug

      - name: Conferir APK gerado
        run: test -f LifeOS-Kotlin/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Life-OS-debug-apk
          path: LifeOS-Kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
